      component: AboutPage,
    },
  };

  /**
   * Returns the current hash route.
   */
  function getCurrentRoute() {
    const hash = window.location.hash.replace("#/", "");

    return ROUTES[hash] ? hash : "dashboard";
  }

  /**
   * Provides the current application route
   * and automatically updates when the URL hash changes.
   */
  function useCurrentRoute() {
    const [route, setRoute] = React.useState(getCurrentRoute());

    React.useEffect(() => {
      function handleHashChange() {
        setRoute(getCurrentRoute());
      }

      window.addEventListener("hashchange", handleHashChange);

      return () => {
        window.removeEventListener("hashchange", handleHashChange);
      };
    }, []);

    return route;
  }

  /**
   * Router Component
   */
  /**
   * Renders the page associated with the current route.
   */
  function Router() {
    const route = useCurrentRoute();

    const CurrentPage = ROUTES[route].component;

    return <CurrentPage />;
  }
