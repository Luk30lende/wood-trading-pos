<style>
  :root {
    --primary: #001f3f;
    --secondary: #0d3b66;

    --background: #f4f6f9;
    --surface: #ffffff;

    --text: #222;
    --text-light: #666;

    --border: #d9d9d9;

    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;

    --radius: 10px;

    --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;

    background: var(--background);

    color: var(--text);
  }

  #root {
    min-height: 100vh;
  }

  .layout {
    min-height: 100vh;

    display: flex;

    flex-direction: column;
  }

  .header {
    height: 65px;

    background: var(--primary);

    color: white;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 24px;

    font-weight: bold;
  }

  .content {
    flex: 1;

    display: flex;
  }

  .sidebar {
    width: 240px;

    background: white;

    border-right: 1px solid var(--border);

    padding: 20px 0;
  }

  .menu-item {
    padding: 14px 24px;

    cursor: pointer;

    transition: 0.2s;
  }

  .menu-item:hover {
    background: #eef4fb;
  }

  .menu-item.active {
    background: #dcecff;

    color: var(--primary);

    font-weight: bold;

    border-right: 4px solid var(--primary);
  }

  .main-content {
    flex: 1;

    padding: 30px;
  }

  .footer {
    height: 45px;

    background: white;

    border-top: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    color: var(--text-light);
  }

  /* =====================================================
   Reusable Button Component
   ===================================================== */

  .ui-button {
    border: none;

    border-radius: var(--radius);

    cursor: pointer;

    font-family: inherit;

    font-weight: 600;

    transition:
      background 0.2s ease,
      transform 0.1s ease,
      opacity 0.2s ease;
  }

  .ui-button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .ui-button:active:not(:disabled) {
    transform: translateY(0);
  }

  .ui-button:disabled {
    cursor: not-allowed;

    opacity: 0.6;
  }

  /* Sizes */

  .ui-button-small {
    padding: 7px 12px;

    font-size: 13px;
  }

  .ui-button-medium {
    padding: 10px 16px;

    font-size: 14px;
  }

  .ui-button-large {
    padding: 13px 20px;

    font-size: 16px;
  }

  /* Variants */

  .ui-button-primary {
    background: var(--primary);

    color: white;
  }

  .ui-button-secondary {
    background: #e9eef4;

    color: var(--primary);
  }

  .ui-button-success {
    background: var(--success);

    color: white;
  }

  .ui-button-danger {
    background: var(--danger);

    color: white;
  }

  /* =====================================================
   Reusable Card Component
   ===================================================== */

  .ui-card {
    background: white;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

    overflow: hidden;
  }

  .ui-card-header {
    min-height: 56px;

    padding: 16px 20px;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 16px;
  }

  .ui-card-title {
    margin: 0;

    font-size: 16px;

    font-weight: 600;

    color: var(--text);
  }

  .ui-card-actions {
    display: flex;

    align-items: center;

    gap: 8px;
  }

  .ui-card-body {
    padding: 20px;
  }

  /* =====================================================
   Reusable Badge Component
   ===================================================== */

  .ui-badge {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 999px;

    font-weight: 600;

    line-height: 1;

    white-space: nowrap;
  }

  /* Sizes */

  .ui-badge-small {
    padding: 5px 8px;

    font-size: 11px;
  }

  .ui-badge-medium {
    padding: 6px 10px;

    font-size: 12px;
  }

  .ui-badge-large {
    padding: 8px 12px;

    font-size: 13px;
  }

  /* Variants */

  .ui-badge-neutral {
    background: #eef1f4;

    color: #495057;
  }

  .ui-badge-primary {
    background: #dcecff;

    color: var(--primary);
  }

  .ui-badge-success {
    background: #dff5e7;

    color: #18733a;
  }

  .ui-badge-warning {
    background: #fff1cc;

    color: #8a5a00;
  }

  .ui-badge-danger {
    background: #fde2e2;

    color: #a52828;
  }

  /* =====================================================
   Reusable Input Component
   ===================================================== */

  .ui-form-group {
    margin-bottom: 18px;
  }

  .ui-form-label {
    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: 600;

    color: var(--text);
  }

  .ui-required {
    margin-left: 4px;

    color: var(--danger);
  }

  .ui-input {
    width: 100%;

    box-sizing: border-box;

    padding: 11px 13px;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    background: white;

    color: var(--text);

    font-family: inherit;

    font-size: 14px;

    outline: none;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .ui-input::placeholder {
    color: #9aa3ad;
  }

  .ui-input:focus {
    border-color: var(--primary);

    box-shadow: 0 0 0 3px rgba(0, 31, 63, 0.08);
  }

  .ui-input:disabled {
    background: #f1f3f5;

    cursor: not-allowed;

    opacity: 0.7;
  }

  .ui-input-error {
    border-color: var(--danger);
  }

  .ui-input-error:focus {
    border-color: var(--danger);

    box-shadow: 0 0 0 3px rgba(165, 40, 40, 0.08);
  }

  .ui-form-help {
    margin-top: 6px;

    font-size: 12px;

    color: var(--text-light);
  }

  .ui-form-error {
    margin-top: 6px;

    font-size: 12px;

    color: var(--danger);
  }

  /* =====================================================
   Reusable Select Component
   ===================================================== */

  .ui-select {
    width: 100%;

    box-sizing: border-box;

    padding: 11px 13px;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    background: white;

    color: var(--text);

    font-family: inherit;

    font-size: 14px;

    outline: none;

    cursor: pointer;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .ui-select:focus {
    border-color: var(--primary);

    box-shadow: 0 0 0 3px rgba(0, 31, 63, 0.08);
  }

  .ui-select:disabled {
    background: #f1f3f5;

    cursor: not-allowed;

    opacity: 0.7;
  }

  .ui-select-error {
    border-color: var(--danger);
  }

  .ui-select-error:focus {
    border-color: var(--danger);

    box-shadow: 0 0 0 3px rgba(165, 40, 40, 0.08);
  }

  /* =====================================================
   Reusable Loader Component
   ===================================================== */

  .ui-loader {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;
  }

  .ui-loader-small {
    padding: 10px;
  }

  .ui-loader-medium {
    padding: 20px;
  }

  .ui-loader-large {
    padding: 40px;

    flex-direction: column;
  }

  .ui-spinner {
    width: 24px;

    height: 24px;

    border: 3px solid #dce2e8;

    border-top-color: var(--primary);

    border-radius: 50%;

    animation: ui-spin 0.8s linear infinite;
  }

  .ui-loader-small .ui-spinner {
    width: 16px;

    height: 16px;

    border-width: 2px;
  }

  .ui-loader-large .ui-spinner {
    width: 36px;

    height: 36px;

    border-width: 4px;
  }

  .ui-loader-message {
    font-size: 14px;

    color: var(--text-light);
  }

  @keyframes ui-spin {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }
</style>
