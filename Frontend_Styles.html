<style>
  :root {
    --primary: #001f3f;
    --secondary: #0d3b66;

    --background: #f4f6f9;
    --surface: #ffffff;

    --text: #222;
    --text-light: #666;

    --border: #d9d9d9;

    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;

    --radius: 10px;

    --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;

    background: var(--background);

    color: var(--text);
  }

  #root {
    min-height: 100vh;
  }

  .layout {
    min-height: 100vh;

    display: flex;

    flex-direction: column;
  }

  .header {
    height: 65px;

    background: var(--primary);

    color: white;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 24px;

    font-weight: bold;
  }

  .content {
    flex: 1;

    display: flex;
  }

  .sidebar {
    width: 240px;

    background: white;

    border-right: 1px solid var(--border);

    padding: 20px 0;
  }

  .menu-item {
    padding: 14px 24px;

    cursor: pointer;

    transition: 0.2s;
  }

  .menu-item:hover {
    background: #eef4fb;
  }

  .menu-item.active {
    background: #dcecff;

    color: var(--primary);

    font-weight: bold;

    border-right: 4px solid var(--primary);
  }

  .main-content {
    flex: 1;

    padding: 30px;
  }

  .footer {
    height: 45px;

    background: white;

    border-top: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    color: var(--text-light);
  }

  /* =====================================================
   Reusable Button Component
   ===================================================== */

  .ui-button {
    border: none;

    border-radius: var(--radius);

    cursor: pointer;

    font-family: inherit;

    font-weight: 600;

    transition:
      background 0.2s ease,
      transform 0.1s ease,
      opacity 0.2s ease;
  }

  .ui-button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .ui-button:active:not(:disabled) {
    transform: translateY(0);
  }

  .ui-button:disabled {
    cursor: not-allowed;

    opacity: 0.6;
  }

  /* Sizes */

  .ui-button-small {
    padding: 7px 12px;

    font-size: 13px;
  }

  .ui-button-medium {
    padding: 10px 16px;

    font-size: 14px;
  }

  .ui-button-large {
    padding: 13px 20px;

    font-size: 16px;
  }

  /* Variants */

  .ui-button-primary {
    background: var(--primary);

    color: white;
  }

  .ui-button-secondary {
    background: #e9eef4;

    color: var(--primary);
  }

  .ui-button-success {
    background: var(--success);

    color: white;
  }

  .ui-button-danger {
    background: var(--danger);

    color: white;
  }
</style>
