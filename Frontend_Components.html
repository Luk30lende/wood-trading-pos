<script type="text/babel">
  /**
   * Reusable Button component.
   *
   * @param {Object} props
   * @param {React.ReactNode} props.children - Button content.
   * @param {Function} props.onClick - Click handler.
   * @param {string} props.variant - Button style variant.
   * @param {string} props.size - Button size.
   * @param {boolean} props.disabled - Disabled state.
   */
  function Button({
    children,
    onClick,
    variant = "primary",
    size = "medium",
    disabled = false,
  }) {
    return (
      <button
        type="button"
        className={`ui-button ui-button-${variant} ui-button-${size}`}
        onClick={onClick}
        disabled={disabled}
      >
        {children}
      </button>
    );
  }

  /**
   * Reusable Card component.
   *
   * @param {Object} props
   * @param {React.ReactNode} props.children - Card content.
   * @param {string} props.title - Optional card title.
   * @param {React.ReactNode} props.actions - Optional header actions.
   * @param {string} props.className - Optional additional CSS classes.
   */
  function Card({ children, title, actions, className = "" }) {
    return (
      <section className={`ui-card ${className}`}>
        {(title || actions) && (
          <div className="ui-card-header">
            {title && <h3 className="ui-card-title">{title}</h3>}

            {actions && <div className="ui-card-actions">{actions}</div>}
          </div>
        )}

        <div className="ui-card-body">{children}</div>
      </section>
    );
  }

  /**
   * Reusable Badge component.
   *
   * @param {Object} props
   * @param {React.ReactNode} props.children - Badge content.
   * @param {string} props.variant - Semantic badge variant.
   * @param {string} props.size - Badge size.
   */
  function Badge({ children, variant = "neutral", size = "medium" }) {
    return (
      <span className={`ui-badge ui-badge-${variant} ui-badge-${size}`}>
        {children}
      </span>
    );
  }

  /**
   * Reusable Input component.
   *
   * @param {Object} props
   * @param {string} props.label - Input label.
   * @param {string} props.name - Input name.
   * @param {string} props.type - Input type.
   * @param {string|number} props.value - Current value.
   * @param {string} props.placeholder - Placeholder text.
   * @param {boolean} props.required - Required state.
   * @param {boolean} props.disabled - Disabled state.
   * @param {string} props.error - Validation error message.
   * @param {string} props.helpText - Optional helper text.
   * @param {Function} props.onChange - Change handler.
   */
  function Input({
    label,
    name,
    type = "text",
    value = "",
    placeholder = "",
    required = false,
    disabled = false,
    error = "",
    helpText = "",
    onChange,
  }) {
    return (
      <div className="ui-form-group">
        {label && (
          <label className="ui-form-label" htmlFor={name}>
            {label}

            {required && <span className="ui-required">*</span>}
          </label>
        )}

        <input
          id={name}
          name={name}
          type={type}
          value={value}
          placeholder={placeholder}
          required={required}
          disabled={disabled}
          className={"ui-input" + (error ? " ui-input-error" : "")}
          onChange={onChange}
        />

        {error && <div className="ui-form-error">{error}</div>}

        {!error && helpText && <div className="ui-form-help">{helpText}</div>}
      </div>
    );
  }

  /**
   * Reusable Select component.
   *
   * @param {Object} props
   * @param {string} props.label - Select label.
   * @param {string} props.name - Select name.
   * @param {string} props.value - Current selected value.
   * @param {Array} props.options - Select options.
   * @param {string} props.placeholder - Placeholder option.
   * @param {boolean} props.required - Required state.
   * @param {boolean} props.disabled - Disabled state.
   * @param {string} props.error - Validation error message.
   * @param {string} props.helpText - Optional helper text.
   * @param {Function} props.onChange - Change handler.
   */
  function Select({
    label,
    name,
    value = "",
    options = [],
    placeholder = "Select an option",
    required = false,
    disabled = false,
    error = "",
    helpText = "",
    onChange,
  }) {
    return (
      <div className="ui-form-group">
        {label && (
          <label className="ui-form-label" htmlFor={name}>
            {label}

            {required && <span className="ui-required">*</span>}
          </label>
        )}

        <select
          id={name}
          name={name}
          value={value}
          required={required}
          disabled={disabled}
          className={"ui-select" + (error ? " ui-select-error" : "")}
          onChange={onChange}
        >
          <option value="">{placeholder}</option>

          {options.map((option) => (
            <option key={option.value} value={option.value}>
              {option.label}
            </option>
          ))}
        </select>

        {error && <div className="ui-form-error">{error}</div>}

        {!error && helpText && <div className="ui-form-help">{helpText}</div>}
      </div>
    );
  }
</script>
